name: Build and deploy to GoDaddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for prerender
        run: npx playwright install --with-deps chromium
      - name: Build site
        run: npm run build
      - name: Prerender pages
        run: npm run prerender
      - name: Upload to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .well-known/**
            cgi-bin/**
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: b3326a7d373ba7f2208fbbbdcfebffec
        run: |
          urls=$(grep -o '<loc>[^<]*' public/sitemap.xml | sed 's/<loc>//' | jq -R . | jq -s -c .)
          body=$(jq -n -c --arg key "$INDEXNOW_KEY" --argjson urls "$urls" '{host:"sheships.dev",key:$key,keyLocation:("https://sheships.dev/"+$key+".txt"),urlList:$urls}')
          echo "$body"
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body" -o /dev/null -w 'IndexNow HTTP %{http_code}\n'
